{{define "content"}}<div class="wrap auth"><form method="post" action="/forgot" class="panel">
<h1>Reset your password</h1>
<p class="muted">Enter your account's e-mail address and we'll send a code.</p>
<label>E-mail<input type="email" name="email" required autofocus autocomplete="email"></label>
<button class="btn wide" type="submit">Send code</button>
<p class="muted center"><a href="/login">Back to log in</a></p>
</form></div>{{end}}
